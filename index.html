<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bookify — studio di scrittura senza distrazioni per romanzieri." />
    <meta name="color-scheme" content="dark" />
    <title>Bookify</title>
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <div id="splash" role="status" aria-label="Bookify si sta avviando">
      <div class="sp-glow"></div>
      <div class="sp-vignette"></div>
      <div class="sp-spark"></div><div class="sp-spark"></div><div class="sp-spark"></div><div class="sp-spark"></div><div class="sp-spark"></div>
      <div class="sp-book" aria-hidden="true">
        <div class="sp-cover"></div>
        <div class="sp-page sp-left"></div>
        <div class="sp-page sp-right"></div>
        <div class="sp-flip f1"></div>
        <div class="sp-flip f2"></div>
        <div class="sp-flip f3"></div>
        <div class="sp-spine"></div>
        <div class="sp-bookmark"></div>
      </div>
      <h1 class="sp-title" aria-label="Bookify">
        <span style="animation-delay: 350ms">B</span><span style="animation-delay: 410ms">o</span><span style="animation-delay: 470ms">o</span><span style="animation-delay: 530ms">k</span><span style="animation-delay: 590ms">i</span><span style="animation-delay: 650ms">f</span><span style="animation-delay: 710ms">y</span>
      </h1>
      <p class="sp-tag" id="splash-tagline">Dove le storie prendono vita</p>
      <div class="sp-ink" aria-hidden="true"><div class="sp-ink-fill"></div><div class="sp-nib"></div></div>
    </div>
    <div id="root"></div>
    <script src="/splash.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
